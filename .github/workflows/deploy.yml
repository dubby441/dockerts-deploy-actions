name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-latest

    outputs:
      backend_image: ${{ steps.images.outputs.backend }}
      frontend_image: ${{ steps.images.outputs.frontend }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image references
        id: images
        run: |
          repo="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "backend=${REGISTRY}/${repo}/backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "frontend=${REGISTRY}/${repo}/frontend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.backend }}
            ${{ env.REGISTRY }}/${{ steps.images.outputs.repo }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.frontend }}
            ${{ env.REGISTRY }}/${{ steps.images.outputs.repo }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve deploy inputs
        id: cfg
        env:
          RAW_DIR: ${{ secrets.EC2_TARGET_DIR }}
          RAW_HOST: ${{ secrets.EC2_HOST }}
          RAW_USER: ${{ secrets.EC2_USERNAME }}
          RAW_PORT: ${{ secrets.EC2_PORT }}
        run: |
          clean() {
            printf '%s' "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          }

          dir="$(clean "$RAW_DIR")"
          host="$(clean "$RAW_HOST")"
          user="$(clean "$RAW_USER")"
          port="$(clean "$RAW_PORT")"

          {
            echo "dir=${dir:-/home/ubuntu/app}"
            echo "host=${host}"
            echo "user=${user:-ubuntu}"
            echo "port=${port:-22}"
          } >> "$GITHUB_OUTPUT"

      - name: Copy deploy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.cfg.outputs.host }}
          username: ${{ steps.cfg.outputs.user }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ steps.cfg.outputs.port }}
          source: "deploy/docker-compose.prod.yml,deploy/deploy.sh"
          target: ${{ steps.cfg.outputs.dir }}
          strip_components: 1
          overwrite: true

      - name: Run deployment
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ steps.cfg.outputs.dir }}

          REGISTRY: ${{ env.REGISTRY }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          BACKEND_IMAGE: ${{ needs.build.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build.outputs.frontend_image }}

          # Use the existing tutorial database credentials if the
          # GitHub secrets have not been created yet.
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'biodata' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'biodata' }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'biodata' }}

          POSTGRES_HOST_PORT: "5433"
          BACKEND_HOST_PORT: "8000"
          FRONTEND_HOST_PORT: "3000"

          CORS_ORIGINS: ${{ vars.CORS_ORIGINS || 'http://18.215.150.207:3000' }}
          LOG_LEVEL: INFO

        with:
          host: ${{ steps.cfg.outputs.host }}
          username: ${{ steps.cfg.outputs.user }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ steps.cfg.outputs.port }}

          envs: APP_DIR,REGISTRY,REGISTRY_USER,REGISTRY_TOKEN,BACKEND_IMAGE,FRONTEND_IMAGE,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,POSTGRES_HOST_PORT,BACKEND_HOST_PORT,FRONTEND_HOST_PORT,CORS_ORIGINS,LOG_LEVEL

          script: |
            set -eu

            : "${APP_DIR:?APP_DIR is empty}"

            test -f "$APP_DIR/deploy.sh" || {
              echo "deploy.sh not found in $APP_DIR"
              ls -la "$APP_DIR"
              exit 1
            }

            chmod +x "$APP_DIR/deploy.sh"

            bash "$APP_DIR/deploy.sh"

      - name: Summary
        run: |
          {
            echo "### Deployed to production"
            echo ""
            echo "| Service | Image |"
            echo "| --- | --- |"
            echo "| backend | \`${{ needs.build.outputs.backend_image }}\` |"
            echo "| frontend | \`${{ needs.build.outputs.frontend_image }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
